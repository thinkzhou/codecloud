function fish(){if(S.en<6)return toast('太累了');S.en-=6;time(25);S.flags.fish=true;item('fish','河鱼','item_crucian');toast('获得：河鱼 ×1 · 新鲜');save()}function sellFish(){const f=S.inv.find(i=>i.id==='fish'&&i.qty);if(!f)return toast('没有鲜鱼');f.qty--;S.wen+=7;toast('+7文');save();hide()}function portal(){S.world='modern';S.flags.modern=true;S.x=220;S.y=520;S.tx=S.ty=null;$('#flash').classList.add('on');setTimeout(()=>$('#flash').classList.remove('on'),500);toast('古代时间停住了');save()}function back(){S.world='ancient';S.flags.back=true;S.x=1970;S.y=365;S.tx=S.ty=null;toast('回到后山，古代时间没有变化');save()}function work(){S.rmb+=8;S.modernMin+=5;S.en=Math.max(0,S.en-3);S.flags.work=true;toast('零活完成 +¥8');save();hide()}function shop(){modal('现代货架',`<div class="grid"><div class="item">${img('item_msg')}<b>味精</b><small>¥3</small></div><div class="item">${img('item_preservative')}<b>保鲜剂</b><small>¥5</small></div><div class="item">${img('item_bread')}<b>面包</b><small>¥4</small></div></div>`,[{text:'味精 ¥3',fn:()=>buy('msg','味精','item_msg',3)},{text:'保鲜剂 ¥5',fn:()=>buy('pres','现代保鲜剂','item_preservative',5)},{text:'面包 ¥4',fn:()=>buy('bread','面包','item_bread',4)}])}function buy(id,name,art,p){if(S.rmb<p)return toast('人民币不够');S.rmb-=p;item(id,name,art);S.flags.buy=true;toast('买到 '+name);save();hide()}function sleep(){S.day++;S.h=6;S.m=30;S.en=Math.min(100,S.en+70);toast('睡到第二天清晨');save()}
function interact(id){if(['bao','sun','chef','shun','tian','lin'].includes(id))talk(id);else if(id==='fish')fish();else if(id==='portal')portal();else if(id==='bed')sleep();else if(id==='work')work();else if(id==='shop')shop();else if(id==='back')back()}$('#prompt').onclick=()=>interact($('#prompt').dataset.id);
function bag(){modal('背囊','<div class="grid">'+S.inv.filter(i=>i.qty>0).map(i=>`<div class="item">${img(i.art)}<b>${i.name}</b><small>×${i.qty}</small>${i.id==='fish'?'<small class="fresh">✨ 新鲜</small>':''}</div>`).join('')+'</div>',[{text:'关闭',fn:hide}])}function map(){const p=[['土地庙',1120,700],['集市',1450,930],['酒楼',1640,720],['田地',520,1120],['青石河',2050,1120],['后山',2050,300]];modal('落霞镇地图','<p>这里不瞬移。选地点后，角色会沿大地图走过去。</p><div class="mapgrid">'+p.map((x,i)=>`<button class="place" data-i="${i}"><b>${x[0]}</b><small>步行前往</small></button>`).join('')+'</div>');setTimeout(()=>document.querySelectorAll('.place').forEach(b=>b.onclick=()=>{const x=p[+b.dataset.i];target(x[1],x[2]);hide()}),0)}function people(){const list=S.world==='modern'?[LIN]:NPC;modal('人物',list.map(n=>`<p><b>${n.name}</b>　${n.id==='bao'?'好感 '+S.aff.bao:n.id==='sun'?'好感 '+S.aff.sun:n.id==='lin'?'好感 '+S.aff.lin:'尚未深入了解'}</p>`).join(''))}function journal(){modal('见闻',`<p>• 小宝说青石河最近有鱼。</p>${S.flags.fish?'<p>• 你已经捕到第一条河鱼。</p>':''}${S.flags.modern?'<p>• 后山白光连接着现代世界。</p>':''}`)}function skills(){modal('技能','<p>捕鱼 Lv.1　经商 Lv.1</p><p>体魄 1　武力 0</p><p>后续继续接回种田、腌制、酒楼供货、医馆和武馆规则。</p>')}
const nav=[['map','ui_map','地图'],['people','ui_person','人物'],['journal','ui_journal','见闻'],['skills','ui_skills','技能'],['bag','ui_bag','背囊'],['portal','ui_portal','穿越']];$('#nav').innerHTML=nav.map(x=>`<button data-x="${x[0]}">${img(x[1])}<span>${x[2]}</span></button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{const x=b.dataset.x;if(x==='map')map();else if(x==='people')people();else if(x==='journal')journal();else if(x==='skills')skills();else if(x==='bag')bag();else if(x==='portal'){if(S.world==='modern')back();else{target(2050,300);toast('后山白光已设为目标')}}});
async function boot(){for(const [k,u] of Object.entries(A)){const im=new Image();im.src=u;imgs[k]=im}await Promise.all(Object.values(imgs).map(im=>im.decode().catch(()=>{})));$('#heroFace').src=A.portrait_hero;$('#splash').style.backgroundImage=`linear-gradient(#07110d44,#07110dcc),url(${A.temple})`;if(!localStorage.getItem('lj_v034'))$('#cont').style.display='none';requestAnimationFrame(tick)}$('#new').onclick=()=>{localStorage.removeItem('lj_v034');$('#splash').style.display='none';save()};$('#cont').onclick=()=>{load();$('#splash').style.display='none'};boot().catch(e=>{alert('启动失败：'+e.message);console.error(e)});
</script></body></html>
