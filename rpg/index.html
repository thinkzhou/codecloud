<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>两界行商 RPG Phase 0</title>
  <style>
    *{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#17150f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#app{position:relative}#game{position:absolute;inset:0}#hud{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;color:#f7eed9;font-size:12px;text-shadow:0 1px 3px #000;background:#17150f99;border:1px solid #d2bd8f55;border-radius:6px;padding:7px 9px}#status{color:#ead19b}#dialogue{position:absolute;z-index:10;left:12px;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));background:#eee0ba;color:#382b21;border:2px solid #71553d;border-radius:6px;padding:12px 44px 12px 14px;box-shadow:0 8px 25px #0008}#dialogue[hidden]{display:none}#dialogue strong{display:block;margin-bottom:6px}#dialogue button{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border:0;background:#5c4633;color:#fff6df;border-radius:4px}#hint{position:absolute;z-index:6;left:50%;bottom:18%;transform:translateX(-50%);padding:6px 10px;background:#111b;color:#f3e5c5;border:1px solid #d1b88366;border-radius:15px;font-size:11px;pointer-events:none;opacity:.9}
  </style>
</head>
<body>
<div id="app">
  <div id="game"></div>
  <div id="hud"><span>Greybox · 落霞镇</span><span id="status">加载中…</span></div>
  <div id="hint">点击地面移动 · 点击小宝自动靠近交谈</div>
  <div id="dialogue" hidden><strong id="speaker"></strong><span id="dialogue-text"></span><button id="dialogue-next" aria-label="继续">›</button></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
