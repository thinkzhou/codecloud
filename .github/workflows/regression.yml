name: regression
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run game regression
        run: node v019/tests/node-smoke.js
