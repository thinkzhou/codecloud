name: regression
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run game regression
        run: node v019/tests/node-smoke.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run v035 integrated-map browser smoke
        run: |
          python3 -m http.server 8000 >/tmp/liangjie-http.log 2>&1 &
          node v035/tests/browser-smoke.mjs
