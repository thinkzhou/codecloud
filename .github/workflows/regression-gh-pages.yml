name: gh-pages-regression
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/regression-gh-pages.yml'
      - 'ci-trigger.txt'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run game regression
        run: node v019/tests/node-smoke.js
      - name: Install browser smoke dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser startup smoke
        run: |
          python3 -m http.server 8000 >/tmp/codecloud-http.log 2>&1 &
          sleep 1
          node v019/tests/browser-smoke.js
      - name: Run v020 illustrated prototype smoke
        run: node v020/tests/browser-smoke.js
