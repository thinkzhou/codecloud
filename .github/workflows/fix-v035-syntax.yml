name: fix-v035-syntax
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/fix-v035-syntax.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Patch v035 syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v035/index.html')
          s=p.read_text()
          old="checks.push(['path available',map.path(state.x,state.y,26*TILE,20*TILE).length>0);"
          new="checks.push(['path available',map.path(state.x,state.y,26*TILE,20*TILE).length>0]);"
          if old not in s:
              raise SystemExit('target syntax pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v035/index.html
          git commit -m "Fix v035 CI syntax"
          git push origin gh-pages
