name: fix-v035-splash
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/fix-v035-splash.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Fix splash hidden state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v035/index.html')
          s=p.read_text()
          old='.splash{position:fixed;z-index:80;'
          new='.splash[hidden]{display:none!important}.splash{position:fixed;z-index:80;'
          if old not in s:
              raise SystemExit('splash CSS target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v035/index.html
          git commit -m "Fix v035 splash dismissal"
          git push origin gh-pages
