<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>山居小院 · 在线试玩</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce8d2;font-family:-apple-system,BlinkMacSystemFont,"Songti SC",serif;color:#3c352c}#app{position:relative;width:min(100vw,560px);height:100dvh;margin:auto;overflow:hidden;background:#dbe7d0}canvas{width:100%;height:100%;touch-action:none}.bar,.dock{position:absolute;left:12px;right:12px;display:flex;gap:7px;z-index:2}.bar{top:max(12px,env(safe-area-inset-top));justify-content:space-between}.card{background:rgba(255,249,230,.93);border:1px solid #9d876866;border-radius:14px;box-shadow:0 6px 16px #4a3d2c22;padding:8px 11px}.stats{display:flex;gap:6px}.pill{background:#465044dd;color:#fff;border-radius:12px;padding:8px 10px;font:13px sans-serif}.quest{position:absolute;left:12px;top:72px;width:260px;z-index:2;font-size:12px;line-height:1.4}.quest b{display:block;font-size:14px}.seed{position:absolute;left:12px;right:12px;bottom:100px;display:flex;gap:5px;overflow:auto;padding:5px;z-index:2}.seed button,.dock button{border:0;border-radius:11px;background:#f8f0dc;padding:8px}.seed button{min-width:78px;text-align:left}.seed button.on{background:#71845b;color:#fff}.dock{bottom:max(10px,env(safe-area-inset-bottom))}.dock button{flex:1;min-height:66px;font-size:13px}.toast{position:absolute;left:50%;bottom:178px;transform:translateX(-50%);background:#302d26dd;color:white;border-radius:18px;padding:8px 13px;z-index:4;font-size:12px;white-space:nowrap}.modal{position:absolute;inset:0;background:#0006;z-index:6;display:grid;place-items:center;padding:18px}.modal.hide{display:none}.panel{width:100%;max-height:75%;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #8f785744;padding:8px 0}.row button{border:0;background:#71845b;color:white;border-radius:9px;padding:7px 10px}.close{float:right;border:0;background:#0001;border-radius:50%;width:30px;height:30px}.hint{position:absolute;left:50%;top:158px;transform:translateX(-50%);font:11px sans-serif;background:#26322b99;color:#fff;padding:5px 9px;border-radius:12px;z-index:2;white-space:nowrap}</style></head><body><main id="app"><canvas id="c" width="750" height="1334"></canvas><div class="bar"><div class="card"><b>山居小院</b><small id="time" style="display:block">第1日 06:00</small></div><div class="stats"><span class="pill">🪙 <b id="coin">28</b></span><span class="pill">🎒 <b id="bag">0</b></span></div></div><div class="quest card"><small>主线 · 初来乍到</small><b id="qt">去和柳婶打个招呼</b><span id="qd">点击右侧柳婶，角色会自动走过去。</span></div><div class="hint">绿色“你”标记就是人物 · 点击地面移动</div><div id="seeds" class="seed card"></div><div id="toast" class="toast">欢迎来到山居小院</div><div class="dock"><button id="shop">🏮<br>集市</button><button id="npc">💬<br>找柳婶</button><button id="sleep">🌙<br>歇息</button></div><div id="modal" class="modal hide"><div class="panel card"><button class="close" id="x">×</button><h3>桃溪集市</h3><div id="shoplist"></div><div class="row"><b>出售全部收成</b><button id="sell">卖出</button></div></div></div></main><script>(()=>{'use strict';const $=s=>document.getElementById(s),cv=$('c'),g=cv.getContext('2d'),W=750,H=1334,tw=108,th=54,O={x:375,y:470},K='ancient-farm-online-v1';const C={radish:['萝卜','🥬',3,8,80,2,'#6d984b'],wheat:['小麦','🌾',5,12,115,2,'#c39a45'],cabbage:['青菜','🥗',4,10,95,2,'#64a05f'],carrot:['胡萝卜','🥕',6,15,110,2,'#d77b3d'],soy:['黄豆','🫘',7,18,140,3,'#b7a45a'],tea:['茶芽','🍃',9,24,165,2,'#4f875b']},order=Object.keys(C);function fresh(){let inv={};for(const k of order){inv[k+'Seed']=k==='radish'?6:k==='wheat'?3:1;inv[k]=0}return{m:360,coin:28,sel:'radish',p:{x:1.1,z:3.6,t:null},inv,plots:Array.from({length:9},(_,i)=>({i,c:null,w:0,g:0})),q:0,pl:0,hr:0}}let s;try{s=JSON.parse(localStorage.getItem(K))||fresh()}catch{s=fresh()}if(!s.p)s.p={x:1.1,z:3.6,t:null};const iso=(x,z,y=0)=>({x:O.x+(x-z)*tw/2,y:O.y+(x+z)*th/2-y*90}),pi=i=>({x:(i%3)*.95,z:1.35+Math.floor(i/3)*.95});let pending=null,last=performance.now(),toastT=0;function save(){localStorage.setItem(K,JSON.stringify(s))}function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;toastT=2.2}function line(x1,y1,x2,y2,c,w=2){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}function poly(a,c,st='#0000'){g.fillStyle=c;g.strokeStyle=st;g.beginPath();a.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fill();g.stroke()}function dia(x,z,sz,c){let p=iso(x,z),a=tw*sz/2,b=th*sz/2;poly([{x:p.x,y:p.y-b},{x:p.x+a,y:p.y},{x:p.x,y:p.y+b},{x:p.x-a,y:p.y}],c,'#614e3433')}function label(t,x,y,b='#fff9df'){g.font='bold 18px serif';let w=g.measureText(t).width+16;g.fillStyle=b;g.fillRect(x-w/2,y-18,w,25);g.fillStyle='#443b30';g.textAlign='center';g.fillText(t,x,y)}function scene(){let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#b9d7cc');gr.addColorStop(.6,'#dce8cf');gr.addColorStop(1,'#a9c18c');g.fillStyle=gr;g.fillRect(0,0,W,H);g.fillStyle='#96b78c';g.beginPath();g.moveTo(0,300);g.quadraticCurveTo(150,200,290,295);g.quadraticCurveTo(470,170,750,310);g.lineTo(750,520);g.lineTo(0,520);g.fill();dia(1.5,2.2,6.8,'#8fb46f');for(const p of s.plots){let q=pi(p.i),o=iso(q.x,q.z);dia(q.x,q.z,.82,p.w?'#694b2f':'#7b5938');if(p.c){let cf=C[p.c],r=Math.min(1,p.g/cf[4]),n=2+Math.floor(r*3);for(let j=0;j<n;j++){let xx=o.x+(j-(n-1)/2)*11,yy=o.y-5-Math.sin(j)*5;line(xx,yy,xx,yy-18-r*12,'#466f42',4);g.fillStyle=cf[6];g.beginPath();g.arc(xx,yy-20-r*10,4+r*4,0,7);g.fill()}if(r>=1)label('可收获',o.x,o.y-48)}}let h=iso(-1.45,.15);g.fillStyle='#e9dfc7';g.fillRect(h.x-80,h.y-80,160,95);poly([{x:h.x-95,y:h.y-80},{x:h.x,y:h.y-135},{x:h.x+95,y:h.y-80}], '#4c4b42');g.fillStyle='#7c4f32';g.fillRect(h.x-22,h.y-30,44,45);label('家',h.x,h.y-105);let m=iso(4.25,1.45);g.fillStyle='#d7b680';g.fillRect(m.x-55,m.y-55,110,70);g.fillStyle='#8a5b38';g.fillRect(m.x-65,m.y-70,130,18);label('集市',m.x,m.y-76);let n=iso(3.55,.65);g.fillStyle='#d7c09d';g.beginPath();g.arc(n.x,n.y-35,15,0,7);g.fill();g.fillStyle='#705b48';g.fillRect(n.x-14,n.y-22,28,36);label('柳婶',n.x,n.y-65);player()}function player(){let p=iso(s.p.x,s.p.z,.12),b=Math.sin(performance.now()/150)*2;g.fillStyle='#26322d33';g.beginPath();g.ellipse(p.x,p.y+8,25,9,0,0,7);g.fill();g.fillStyle='#4f7d73';g.fillRect(p.x-18,p.y-45+b,36,38);g.fillStyle='#d6b878';g.fillRect(p.x-19,p.y-20+b,38,6);g.fillStyle='#eadfc9';g.beginPath();g.arc(p.x,p.y-59+b,17,0,7);g.fill();g.fillStyle='#2c2d2a';g.beginPath();g.arc(p.x,p.y-65+b,18,Math.PI,Math.PI*2);g.fill();g.fillStyle='#d4b36f';g.beginPath();g.ellipse(p.x,p.y-78+b,30,7,0,0,7);g.fill();label('你',p.x,p.y-96+b,'#e7f7d8')}function move(x,z,a){s.p.t={x,z};pending=a}function update(dt){s.m+=dt*10;for(const p of s.plots)if(p.c&&p.w)p.g+=dt*10;let t=s.p.t;if(t){let dx=t.x-s.p.x,dz=t.z-s.p.z,d=Math.hypot(dx,dz);if(d<.05){s.p.x=t.x;s.p.z=t.z;s.p.t=null;let a=pending;pending=null;if(a)act(a)}else{let q=Math.min(d,dt*2.1);s.p.x+=dx/d*q;s.p.z+=dz/d*q}}if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=.65}ui()}function act(a){if(a.t==='p')plot(a.i);if(a.t==='n')talk();if(a.t==='s')openShop()}function plot(i){let p=s.plots[i],k=s.sel,cf=C[k];if(!p.c){if(!s.inv[k+'Seed'])return toast('种子不够，去集市购买');s.inv[k+'Seed']--;p.c=k;p.w=0;p.g=0;if(k==='radish')s.pl++;toast('播种成功，再点一次浇水')}else if(!p.w){p.w=1;toast('已经浇水')}else{let cf2=C[p.c];if(p.g<cf2[4])return toast('还没有成熟');s.inv[p.c]+=cf2[5];if(p.c==='radish')s.hr+=cf2[5];p.c=null;p.w=0;p.g=0;toast('收获完成')}save();seedUI();quest()}function talk(){if(s.q===0){s.q=1;toast('柳婶：先种 3 株萝卜吧')}else if(s.q===1&&s.pl>=3){s.q=2;toast('柳婶：不错，再收获 2 个萝卜')}else if(s.q===2&&s.hr>=2){s.q=3;s.coin+=30;s.inv.cabbageSeed+=3;toast('任务完成！+30 铜钱，+3 青菜种子')}else toast(s.q===1?`已种萝卜 ${s.pl}/3`:s.q===2?`已收获萝卜 ${Math.min(2,s.hr)}/2`:'柳婶：慢慢经营小院吧');save();quest()}function quest(){let t=['去和柳婶打个招呼','种下 3 株萝卜','收获 2 个萝卜','经营自己的小院'][Math.min(3,s.q)],d=s.q===0?'点击右侧柳婶。':s.q===1?`选择萝卜，播种 ${s.pl}/3`:s.q===2?`浇水等待成熟，收获 ${Math.min(2,s.hr)}/2`:'序章完成，可以自由种田和交易。';$('qt').textContent=t;$('qd').textContent=d}function seedUI(){$('seeds').innerHTML='';for(const k of order){let b=document.createElement('button');b.className=s.sel===k?'on':'';b.innerHTML=`<b>${C[k][1]} ${C[k][0]}</b><br><small>种子 ${s.inv[k+'Seed']}</small>`;b.onclick=()=>{s.sel=k;seedUI();toast('已选择'+C[k][0])};$('seeds').appendChild(b)}}function openShop(){$('modal').classList.remove('hide');let d=$('shoplist');d.innerHTML='';for(const k of order){let r=document.createElement('div');r.className='row';r.innerHTML=`<span>${C[k][1]} ${C[k][0]}种子 · ${C[k][2]}铜钱</span><button>购买</button>`;r.querySelector('button').onclick=()=>{if(s.coin<C[k][2])return toast('铜钱不够');s.coin-=C[k][2];s.inv[k+'Seed']++;save();seedUI();ui()};d.appendChild(r)}}function ui(){let day=Math.floor(s.m/1440)+1,m=Math.floor(s.m%1440),h=Math.floor(m/60);$('time').textContent=`第${day}日 ${String(h).padStart(2,'0')}:${String(Math.floor(m%60)).padStart(2,'0')}`;$('coin').textContent=s.coin;$('bag').textContent=order.reduce((a,k)=>a+s.inv[k],0)}function screen(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}function hit(p){for(let i=8;i>=0;i--){let q=pi(i),o=iso(q.x,q.z),a=tw*.82/2,b=th*.82/2;if(Math.abs(p.x-o.x)/a+Math.abs(p.y-o.y)/b<=1)return i}return-1}function uniso(x,y){let A=(x-O.x)/(tw/2),B=(y-O.y)/(th/2);return{x:(A+B)/2,z:(B-A)/2}}cv.onpointerdown=e=>{let p=screen(e),i=hit(p);if(i>=0){let q=pi(i);return move(q.x+.3,q.z+.35,{t:'p',i})}let n=iso(3.55,.65),m=iso(4.25,1.45);if(Math.hypot(p.x-n.x,p.y-n.y)<65)return move(3.25,1,{t:'n'});if(Math.hypot(p.x-m.x,p.y-m.y)<90)return move(3.6,1.8,{t:'s'});let w=uniso(p.x,p.y);move(Math.max(-1.4,Math.min(4.6,w.x)),Math.max(-.4,Math.min(4.5,w.z)))};$('npc').onclick=()=>move(3.25,1,{t:'n'});$('shop').onclick=()=>move(3.6,1.8,{t:'s'});$('sleep').onclick=()=>{let next=(Math.floor(s.m/1440)+1)*1440+360,delta=next-s.m;for(const p of s.plots)if(p.c&&p.w)p.g+=delta;s.m=next;s.plots.forEach(p=>p.w=0);toast('天亮了，记得重新浇水');save()};$('x').onclick=()=>$('modal').classList.add('hide');$('sell').onclick=()=>{let n=0,v=0;for(const k of order){n+=s.inv[k];v+=s.inv[k]*C[k][3];s.inv[k]=0}if(!n)return toast('没有可卖的作物');s.coin+=v;toast(`卖出 ${n} 份，获得 ${v} 铜钱`);save();ui()};seedUI();quest();ui();function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);scene();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></main></body></html>
