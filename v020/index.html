<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17140f">
<title>两界行商 · 可行走2D试玩 v0.32.0</title>
<link rel="stylesheet" href="./style.css?v=0320">
<link rel="stylesheet" href="./walk.css?v=0320">
</head>
<body>
<div id="game" class="game">
  <header class="hud">
    <div class="brand">
      <span class="heroMedallion" aria-hidden="true"><span>行</span></span>
      <div><b>两界行商</b><small>无名小乞丐 · Lv.1</small></div>
    </div>
    <div class="clock"><span id="day">第1日</span><b id="time">17:30</b><small id="where">土地庙</small></div>
    <div class="stats">
      <span class="coinStat"><i>钱</i><b id="money">0</b></span>
      <span class="energyStat"><i>气</i><b id="energy">22</b></span>
      <span class="healthStat"><i>命</i><b id="health">100</b></span>
    </div>
  </header>

  <main id="scene" class="scene temple">
    <div id="sceneArt" class="sceneArt" aria-hidden="true"></div>
    <div class="sceneGrade" aria-hidden="true"></div>
    <button id="questChip" class="questChip"><span>今日待办</span><b id="questText">先活过今晚</b><em>›</em></button>
    <section id="npcLayer" class="npcLayer"></section>
    <section id="dialogue" class="dialogue hidden">
      <div id="speakerAvatar" class="speakerAvatar"></div>
      <div class="speech"><b id="speaker">旁白</b><p id="speechText"></p></div>
      <button id="dialogueNext" class="nextBtn" aria-label="继续">▼</button>
    </section>
    <section id="actions" class="actions"></section>
  </main>

  <nav class="dock">
    <button data-panel="map"><span class="dockIcon">山</span><small>地图</small></button>
    <button data-panel="people"><span class="dockIcon">人</span><small>人物</small></button>
    <button data-panel="journal"><span class="dockIcon">闻</span><small>见闻</small></button>
    <button data-panel="skills"><span class="dockIcon">武</span><small>技能</small></button>
    <button data-panel="bag"><span class="dockIcon">囊</span><small>背囊</small></button>
    <button id="portalDock"><span class="portalOrb">◉</span><small>穿越</small></button>
  </nav>
</div>
<div id="toast" class="toast"></div>
<div id="overlay" class="overlay hidden"><div id="panel" class="panel"></div></div>
<script src="./game.js?v=0320"></script>
<script src="./walk.js?v=0320"></script>
</body>
</html>
