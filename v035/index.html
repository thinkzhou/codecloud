<style>

alc(var(--safeT) + 87px);font-size:10px;color:#e7d4a8;background:#152a23e8;border:1px solid #9f8353;border-radius:4px;padding:5px 7px}.prompt{position:fixed;z-index:25;left:50%;bottom:calc(var(--safeB) + 86px);transform:translateX(-50%);min-width:150px;min-height:45px;border:1px solid #d3b269;background:#142a23f2;color:#f4e4bc;border-radius:23px;padding:8px 16px;box-shadow:0 6px 18px #0008;display:none}.prompt.show{display:block}.nav{position:fixed;z-index:22;left:0;right:0;bottom:0;height:calc(77px + var(--safeB));padding:5px 4px var(--safeB);display:flex;background:linear-gradient(#1c3029fa,#0d1f19fc);border-top:1px solid #93774c;box-shadow:0 -7px 20px #0005}.nav button{flex:1;border:0;background:none;color:#e8d9b7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px}.nav .ico{width:36px;height:36px;display:grid;place-items:center;border:1px solid #8f7953;border-radius:9px;background:#25392f;font:700 18px STSong,serif}.nav button.active .ico{background:#5b4930;border-color:#d1ae66;color:#ffe0a0}.toast{position:fixed;z-index:50;left:50%;top:106px;transform:translate(-50%,-8px);opacity:0;background:#14271fee;border:1px solid #ab8d58;color:#f4e2bc;padding:8px 12px;border-radius:5px;font-size:11px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;z-index:40;inset:0;background:#07130fbb;display:none;align-items:center;justify-content:center;padding:calc(var(--safeT) + 14px) 11px calc(var(--safeB) + 15px)}.modal.show{display:flex}.panel{width:min(620px,100%);max-height:90vh;overflow:hidden;background:linear-gradient(#f4e8cf,#eadbbd);border:2px solid #a68752;border-radius:9px;color:var(--ink);box-shadow:0 22px 65px #000c}.mhead{height:54px;border-bottom:1px solid #b89a63;display:flex;align-items:center;padding-left:14px;background:#f7ecd7}.mhead h2{font:700 19px STSong,serif;color:#754632;margin:0;flex:1}.close{width:50px;height:50px;border:0;background:none;color:#764e36;font-size:27px}.mbody{padding:13px;max-height:68vh;overflow:auto;line-height:1.65}.acts{display:flex;gap:7px;flex-wrap:wrap;padding:0 13px 13px}.btn{flex:1;min-height:44px;padding:9px 10px;border:1px solid #927142;border-radius:5px;color:#322417;background:linear-gradient(#eed08c,#d5ad60)}.btn.sec{background:#dfd3bb;color:#514638}.dialogue{display:grid;grid-template-columns:95px 1fr;gap:12px;align-items:center}.portrait{width:88px;height:120px;display:grid;place-items:center;position:relative}.portrait .mini-person{transform:scale(1.55);transform-origin:center bottom}.dialogue p{margin:4px 0;font:14px/1.8 STSong,Songti SC,serif}.baggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.item{background:#26392f;border:1px solid #897553;color:#efdfbf;border-radius:6px;min-height:100px;padding:7px;text-align:center}.item .itemico{height:47px;display:grid;place-items:center;font-size:30px}.item small{display:block;color:#c1ae8d}.mapwrap{background:#caba93;border:1px solid #8f7447;padding:5px;border-radius:5px}.mapwrap canvas{width:100%;height:auto;display:block;background:#c8b78f;border:1px solid #8a754e}.legend{text-align:center;color:#765f43;font-size:10px;margin-top:7px}.splash{position:fixed;z-index:80;inset:0;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#314a3b,#172a22)}.splash:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,#d9985766,transparent 35%),linear-gradient(180deg,#526359 0 30%,#24392f 65%,#13221c)}.splash .mountains{position:absolute;left:0;right:0;bottom:30%;height:35%;opacity:.6;background:linear-gradient(145deg,transparent 0 15%,#293a35 15% 28%,transparent 28% 34%,#1f302b 34% 48%,transparent 48% 54%,#293b34 54% 68%,transparent 68%)}.sbox{position:relative;z-index:2;width:min(450px,92vw);margin-bottom:calc(var(--safeB) + 40px);text-align:center;color:#eddbb3;padding:23px 18px;background:#10221cdc;border:1px solid #aa8a54;border-radius:9px;box-shadow:0 20px 70px # <section id="splash" class="splash"><div class="mountains"></div><div class="sbox"><h1>两界行商</h1><p>落霞镇 · 融景大地图</p><button id="new" class="btn">开始新旅程</button><button id="cont" class="btn sec">继续游戏</button><div class="version">TRUE TILE WORLD · v0.35.0</div></div></section>
<script>
'use strict';
const $=s=>document.querySelector(s), cv=$('#game'), ctx=cv.getContext('2d');
const TILE=64, COLS=54, ROWS=38, W=COLS*TILE, H=ROWS*TILE;
const C={grass:'#5f7457',grass2:'#6e805e',soil:'#88735b',road:'#a99a7d',road2:'#97896f',water:'#315f69',water2:'#427583',wall:'#9f8060',wood:'#513c2c',roof:'#303b3a',roof2:'#46504b',lantern:'#e5a34c'};
const state={day:1,h:17,m:30,en:86,hp:92,wen:328,rmb:0,world:'ancient',x:20*TILE,y:16*TILE,dir:'down',inventory:[{id:'bun',name:'硬馒头',q:1}],aff:{bao:0,sun:0,lin:0},flags:{bao:false,fish:false,modern:false,work:false,buy:false,back:false},modernMin:20};
const saveKey='liangjie_v035_integrated';
let map=null,path=[],pending=null,cam={x:0,y:0},last=0,walkPhase=0,near=null,toastTimer;
const NPCS={
 bao:{name:'小宝',x:23,y:17,kind:'kid'},sun:{name:'孙婆婆',x:15,y:14,kind:'granny'},chef:{name:'李大厨',x:31,y:14,kind:'chef'},shun:{name:'阿顺',x:28,y:20,kind:'shun'},tian:{name:'田伯',x:10,y:27,kind:'farmer'},lin:{name:'林晓',x:14,y:11,kind:'lin'}
};
const landmarks=[
 {id:'temple',name:'土地庙',x:18,y:10},{id:'market',name:'集市',x:26,y:20},{id:'restaurant',name:'酒楼',x:33,y:13},{id:'clinic',name:'医馆',x:39,y:14},{id:'dojo',name:'武馆',x:44,y:13},{id:'farm',name:'菜地',x:10,y:28},{id:'river',name:'青石河',x:40,y:31},{id:'hill',name:'后山',x:45,y:6}
];
function personHTML(kind='hero'){return `<div class="mini-person ${kind}"><i class="shadow"></i><i class="leg1"></i><i class="leg2"></i><i class="body"></i><i class="belt"></i><i class="head"></i><i class="hair"></i><i class="eye1"></i><i class="eye2"></i><i class="bag"></i></div>`}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function save(){try{localStorage.setItem(saveKey,JSON.stringify(state))}catch{}}
function loadSave(){try{const x=JSON.parse(localStorage.getItem(saveKey)||'null');if(x)Object.assign(state,x)}catch{}}
function reset(){localStorage.removeItem(saveKey);Object.assign(state,{day:1,h:17,m:30,en:86,hp:92,wen:328,rmb:0,world:'ancient',x:20*TILE,y:16*TILE,dir:'down',inventory:[{id:'bun',name:'硬馒头',q:1}],aff:{bao:0,sun:0,lin:0},flags:{bao:false,fish:false,modern:false,work:false,buy:false,back:false},modernMin:20});buildWorld();save();}
function addTime(min){if(state.world==='modern'){state.modernMin+=min;return}state.m+=min;while(state.m>=60){state.m-=60;state.h++}if(state.h>=24){state.h%=24;state.day++}}
function item(id,name,q=1){let i=state.inventory.find(x=>x.id===id);i?i.q+=q:state.inventory.push({id,name,q})}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1500)}
function quest(){if(!state.flags.bao)return'和小宝聊聊，听听青石河的消息。';if(!state.flags.fish)return'沿石板路去青石河，捕到第一条鱼。';if(!state.flags.modern)return'去后山看看那道奇怪的白光。';if(!state.flags.work)return'在便利店问林晓有没有零活。';if(!state.flags.buy)return'用刚挣的钱买一件现代商品。';if(!state.flags.back)return'带着现代商品回落霞镇。';return'两界已经连通。接下来可以开始真正的行商。'}
function region(){if(state.world==='modern')return'星辰便利店';let best=landmarks[0],d=1e9;for(const l of landmarks){const dd=Math.hypot(state.x/TILE-l.x,state.y/TILE-l.y);if(dd<d){d=dd;best=l}}return best.name}
function refresh(){$('#loc').textContent=(state.world==='modern'?'临海市 · ':'落霞镇 · ')+region();$('#clock').textContent=state.world==='modern'?`现代 · ${14+Math.floor(state.modernMin/60)}:${String(state.modernMin%60).padStart(2,'0')}（古代时间冻结）`:`第${state.day}日 · ${String(state.h).padStart(2,'0')}:${String(state.m).padStart(2,'0')}`;$('#enT').textContent=state.en;$('#hpT').textContent=state.hp;$('#enB').style.width=state.en+'%';$('#hpB').style.width=state.hp+'%';$('#money').textContent=state.world==='modern'?`¥${state.rmb}`:`${state.wen}文`;$('#worldtag').textContent=state.world==='modern'?'现代 · 时间冻结':'古代 · 黄昏';$('#quest').textContent=quest();updateNear();}
function resize(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function hash(x,y){let n=(x*928371+y*364479+17)%9973;return (Math.sin(n)*43758.5453)%1}
class TileWorld{
 constructor(kind){this.kind=kind;this.grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));this.base=document.createElement('canvas');this.base.width=W;this.base.height=H;this.g=this.base.getContext('2d');this.points=[];this.npcs=[];this.fore=[];this.build()}
 block(x,y,w,h){for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(yy>=0&&yy<ROWS&&xx>=0&&xx<COLS)this.grid[yy][xx]=1}
 roadRect(x,y,w,h){const g=this.g;for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){const px=xx*TILE,py=yy*TILE;g.fillStyle=(xx+yy)%2?C.road:C.road2;g.fillRect(px,py,TILE,TILE);g.strokeStyle='#736a59';g.globalAlpha=.19;g.strokeRect(px+3,py+4,TILE-7,TILE-8);g.globalAlpha=1}}
 building(x,y,w,h,label,accent='#704d32'){
  const g=this.g,px=x*TILE,py=y*TILE,bw=w*TILE,bh=h*TILE;
  g.save();g.fillStyle='#1b241d45';g.filter='blur(8px)';g.fillRect(px+12,py+bh-10,bw-24,24);g.restore();
  const wall=g.createLinearGradient(px,py,px,py+bh);wall.addColorStop(0,'#b39673');wall.addColorStop(1,'#80664f');g.fillStyle=wall;g.fillRect(px+8,py+35,bw-16,bh-42);
  g.fillStyle='#4b3728';for(let xx=px+15;xx<px+bw-10;xx+=32)g.fillRect(xx,py+38,5,bh-50);
  g.fillStyle='#d3a65c';for(let xx=px+30;xx<px+bw-38;xx+=62){g.fillRect(xx,py+bh-73,29,43);g.fillStyle='#f2c56b';g.fillRect(xx+4,py+bh-68,21,29);g.fillStyle='#d3a65c'}
  g.fillStyle='#283331';g.beginPath();g.moveTo(px-18,py+44);g.lineTo(px+25,py+3);g.lineTo(px+bw-25,py+3);g.lineTo(px+bw+18,py+44);g.lineTo(px+bw-3,py+61);g.lineTo(px+3,py+61);g.closePath();g.fill();
  g.strokeStyle='#53605b';g.lineWidth=3;for(let yy=py+12;yy<py+54;yy+=10){g.beginPath();g.moveTo(px+5,yy);g.quadraticCurveTo(px+bw/2,yy+6,px+bw-5,yy);g.stroke()}
  g.fillStyle=accent;g.fillRect(px+bw/2-37,py+48,74,25);g.strokeStyle='#d5b274';g.strokeRect(px+bw/2-37,py+48,74,25);g.fillStyle='#f1ddb4';g.font='700 16px STSong,serif';g.textAlign='center';g.fillText(label,px+bw/2,py+66);
  this.block(x,y+1,w,h-1)
 }
 tree(x,y,scale=1,front=false){const g=this.g,px=x*TILE,py=y*TILE;g.fillStyle='#45392c';g.fillRect(px-8*scale,py-15*scale,16*scale,60*scale);const colors=['#3c5b3e','#4b6846','#5d764e','#927a41'];for(let i=0;i<10;i++){const a=i*2.39,r=22+(i%4)*10,cx=px+Math.cos(a)*r*scale,cy=py-38*scale+Math.sin(a)*r*.55*scale;g.fillStyle=colors[i%colors.length];g.beginPath();g.arc(cx,cy,(26+(i%3)*8)*scale,0,6.3);g.fill()}if(front)this.fore.push({type:'tree',x:px,y:py,scale});this.block(x-1,y,3,1)}
 stall(x,y,color='#8a5843'){const g=this.g,px=x*TILE,py=y*TILE;g.fillStyle='#4b392c';g.fillRect(px+8,py+34,112,50);g.fillStyle=color;g.beginPath();g.moveTo(px,py+34);g.lineTo(px+18,py+8);g.lineTo(px+110,py+8);g.lineTo(px+128,py+34);g.closePath();g.fill();g.strokeStyle='#efd69f';for(let xx=px+12;xx<px+120;xx+=20){g.beginPath();g.moveTo(xx,py+12);g.lineTo(xx+5,py+32);g.stroke()}g.fillStyle='#746247';for(let i=0;i<5;i++)g.fillRect(px+17+i*19,py+53,13,13);this.block(x,y+1,2,1)}
 bridge(x,y,w=4){const g=this.g,px=x*TILE,py=y*TILE;g.fillStyle='#6d543d';g.fillRect(px,py,w*TILE,TILE*2);g.strokeStyle='#a68763';for(let xx=px;xx<px+w*TILE;xx+=18){g.beginPath();g.moveTo(xx,py+4);g.lineTo(xx,py+TILE*2-4);g.stroke()}for(let xx=x;xx<x+w;xx++)for(let yy=y;yy<y+2;yy++)this.grid[yy][xx]=0}
 build(){this.kind==='modern'?this.buildModern():this.buildAncient()}
 buildAncient(){const g=this.g;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const px=x*TILE,py=y*TILE,n=Math.abs(hash(x,y));g.fillStyle=n>.6?C.grass2:C.grass;g.fillRect(px,py,TILE,TILE);g.globalAlpha=.15;g.fillStyle=n>.5?'#d1b772':'#283b2d';for(let i=0;i<6;i++)g.fillRect(px+(i*17+x*7)%60,py+(i*23+y*11)%60,2,2);g.globalAlpha=1}
  for(let y=30;y<ROWS;y++)for(let x=0;x<COLS;x++){const px=x*TILE,py=y*TILE;g.fillStyle=(x+y)%2?C.water:C.water2;g.fillRect(px,py,TILE,TILE);g.strokeStyle='#87aaa5';g.globalAlpha=.18;g.beginPath();g.moveTo(px+4,py+18+(x%3)*10);g.quadraticCurveTo(px+32,py+10,px+60,py+18+(x%3)*10);g.stroke();g.globalAlpha=1;this.grid[y][x]=1}
  this.roadRect(17,4,5,26);this.roadRect(8,17,39,5);this.roadRect(24,11,18,4);this.roadRect(32,7,4,23);this.roadRect(8,24,10,6);this.roadRect(39,20,5,10);

function settings(){modal('设置',`<p>两界行商 · 融景大地图 v0.35.0</p><p>这一版不再把房屋 PNG 贴到背景：道路、水面、建筑、屋顶、灯火、树木和碰撞都在地图分层中生成。</p>`,[{text:'重新开始',fn:()=>{reset();hide();toast('已经重新开始')}}])}
const navs=[['地图','图',drawLargeMap],['人物','人',people],['见闻','闻',journal],['技能','技',skills],['行囊','囊',openBag],['设置','设',settings]];$('#nav').innerHTML=navs.map((n,i)=>`<button data-i="${i}"><span class="ico">${n[1]}</span>${n[0]}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>navs[+b.dataset.i][2]());$('#prompt').onclick=()=>interact(near);
$('#new').onclick=()=>{reset();$('#splash').hidden=true;refresh()};$('#cont').onclick=()=>{loadSave();buildWorld();$('#splash').hidden=true;refresh()};
loadSave();buildWorld();refresh();requestAnimationFrame(tick);
if(new URLSearchParams(location.search).get('ci')==='1'){setTimeout(()=>{const checks=[];checks.push(['world created',!!map&&W===3456&&H===2432]);checks.push(['map layered buildings',map.grid.flat().some(Boolean)]);checks.push(['path available',map.path(state.x,state.y,26*TILE,20*TILE).length>0]);checks.push(['true map action',typeof drawLargeMap==='function']);checks.push(['NPC count',map.npcs.length>=5]);const pre=document.createElement('pre');pre.id='ci-result';pre.textContent=checks.map(c=>(c[1]?'PASS ':'FAIL ')+c[0]).join('\n');document.body.appendChild(pre);if(checks.every(c=>c[1]))document.title='CI_PASS';},300)}
</script>
</body></html>
