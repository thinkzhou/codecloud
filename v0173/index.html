<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>两界行商 v0.17.3</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#17140f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#33291e}.app{max-width:480px;height:100dvh;margin:auto;background:#efe5ce;display:flex;flex-direction:column}.top{min-height:64px;padding:12px 14px;background:#30291f;color:#fff;display:flex;align-items:center;justify-content:space-between}.screen{flex:1;overflow:auto;padding:14px}.hero{min-height:145px;padding:20px;border-radius:18px;background:linear-gradient(135deg,#654b34,#a47c4d);color:white;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:10px}.card{background:#fffaf0;border:1px solid #d2bf9d;border-radius:15px;padding:14px;margin:10px 0}.btn{width:100%;min-height:50px;border:1px solid #9a7649;background:#f8ecd5;border-radius:12px;margin:5px 0;padding:11px;text-align:left;font:inherit}.primary{background:#77502d;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav{height:70px;background:#30291f;display:grid;grid-template-columns:repeat(6,1fr)}.nav button{border:0;background:transparent;color:#f2e4c7;font-size:15px}.nav small{display:block;font-size:9px}.muted{font-size:12px;color:#796b59}.hidden{display:none}.error{white-space:pre-wrap;color:#922}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(480px,100%);max-height:75vh;overflow:auto;background:#efe5ce;padding:18px;border-radius:18px 18px 0 0}</style></head><body><div class="app"><header class="top"><div><b id="dateText">两界行商</b><br><span id="clockText">v0.17.3</span></div><div id="energyText"></div><div id="moneyText"></div></header><main id="screen" class="screen"><div class="hero"><h2>两界行商 v0.17.3</h2><p>单文件稳定版</p></div><div class="card"><p id="saveHint" class="muted">正在检查存档……</p><button id="loadBtn" class="btn hidden">读取存档</button><button id="newBtn" class="btn primary">重新开始</button></div></main><nav class="nav"><button id="mapBtn">🗺<small>地图</small></button><button id="peopleBtn">♥<small>人物</small></button><button id="rumorBtn">📖<small>见闻</small></button><button id="skillBtn">✦<small>技能</small></button><button id="bagBtn">🎒<small>背囊</small></button><button id="portalBtn">◉<small>穿越</small></button></nav></div><div id="overlay" class="overlay hidden"><div id="sheet" class="sheet"></div></div><script>(function(){'use strict';var screen=document.getElementById('screen'),overlay=document.getElementById('overlay'),sheet=document.getElementById('sheet');var LOC={temple:{name:'土地庙',x:0,y:0},lane:{name:'贫民巷',x:1,y:1},market:{name:'集市',x:3,y:1},book:{name:'书铺',x:2,y:2},carpenter:{name:'木匠坊',x:4,y:0},pharmacy:{name:'药铺',x:4,y:2},restaurant:{name:'酒楼',x:5,y:2},store:{name:'杂货铺',x:3,y:2},river:{name:'青石河',x:2,y:4},field:{name:'镇外菜地',x:4,y:4},lake:{name:'镜湖',x:7,y:5},hill:{name:'后山',x:-2,y:3}};function fresh(){return{day:2,min:420,energy:60,moral:100,money:0,rmb:0,place:'temple',aff:{wang:18,ahe:14,suwan:12,li:5,zhou:3,chen:5,liu:12,xiaobao:20},skills:{fishing:0,farming:0,wood:0,medicine:0,trade:0,retail:0},bags:{travel:{},ancient:{},home:{}},tasks:{},rumors:[]};}var S=fresh();function pad(n){return n<10?'0'+n:String(n)}function clock(){return pad(Math.floor(S.min/60))+':'+pad(S.min%60)}function top(){document.getElementById('dateText').textContent='辰历 三月初'+(S.day+5);document.getElementById('clockText').textContent=clock();document.getElementById('energyText').textContent='⚡ '+S.energy+'%';document.getElementById('moneyText').textContent=S.money+'文 · ¥'+S.rmb}function save(){try{localStorage.setItem('liangjie_v0173',JSON.stringify(S));return true}catch(e){return false}}function load(){try{var x=localStorage.getItem('liangjie_v0173');if(!x)return false;S=JSON.parse(x);return true}catch(e){return false}}function dist(a,b){var A=LOC[a],B=LOC[b],dx=A.x-B.x,dy=A.y-B.y;return Math.sqrt(dx*dx+dy*dy)}function travel(id){if(id===S.place)return{m:0,e:0};var d=dist(S.place,id);return{m:Math.max(5,Math.round(d*8)),e:Math.max(1,Math.round(d*1.8))}}function showMap(){var h='<div class="hero"><h2>青石镇 · '+clock()+'</h2><p>当前位置：'+LOC[S.place].name+'</p></div><div class="grid">';for(var id in LOC){if(!LOC.hasOwnProperty(id))continue;var c=travel(id);h+='<button class="btn place" data-id="'+id+'"><b>'+LOC[id].name+'</b><br><span class="muted">'+(id===S.place?'你在这里，不耗体力':'约'+c.m+'分钟 · 体力'+c.e)+'</span></button>'}h+='</div><button id="saveGame" class="btn primary">保存游戏</button>';screen.innerHTML=h;top();var bs=screen.querySelectorAll('.place');for(var i=0;i<bs.length;i++){bs[i].addEventListener('click',function(){var id=this.getAttribute('data-id'),c=travel(id);if(id===S.place){showMap();return}if(S.energy<c.e){showSheet('<h3>体力不足</h3><p>去这里需要约 '+c.e+' 点体力。</p><button id="closeSheet" class="btn">知道了</button>');return}S.energy-=c.e;S.min+=c.m;S.place=id;showMap()})}document.getElementById('saveGame').addEventListener('click',function(){save();showSheet('<h3>已保存</h3><button id="closeSheet" class="btn primary">继续</button>')})}function showSheet(html){sheet.innerHTML=html;overlay.classList.remove('hidden');var c=document.getElementById('closeSheet');if(c)c.addEventListener('click',function(){overlay.classList.add('hidden')})}function bindSimple(id,title,text){document.getElementById(id).addEventListener('click',function(){showSheet('<h3>'+title+'</h3><p>'+text+'</p><button id="closeSheet" class="btn primary">关闭</button>')})}document.getElementById('newBtn').addEventListener('click',function(){S=fresh();save();showMap()});var has=false;try{has=!!localStorage.getItem('liangjie_v0173')}catch(e){}document.getElementById('saveHint').textContent=has?'发现存档，可以继续，也可以重新开始。':'还没有存档。';if(has){var lb=document.getElementById('loadBtn');lb.classList.remove('hidden');lb.classList.add('primary');lb.addEventListener('click',function(){if(load())showMap()})}document.getElementById('mapBtn').addEventListener('click',showMap);bindSimple('peopleBtn','人物','启动稳定版：人物模块下一步接回。');bindSimple('rumorBtn','见闻','启动稳定版：见闻模块下一步接回。');bindSimple('skillBtn','技能','启动稳定版：技能模块下一步接回。');bindSimple('bagBtn','背囊','启动稳定版：背囊模块下一步接回。');bindSimple('portalBtn','穿越','启动稳定版：穿越模块下一步接回。');top();})();</script></body></html>
