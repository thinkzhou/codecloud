<style>*{box-sizing:border-box}body{margin:0;background:#191814;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#2b251d}.app{width:min(100vw,430px);min-height:100vh;margin:0 auto;background:#efe7d5;display:flex;flex-direction:column;box-shadow:0 0 40px #0008}.topbar{height:52px;padding:0 14px;background:#332b22;color:#f6ecd6;display:flex;align-items:center;justify-content:space-between;font-size:13px}.screen{flex:1;min-height:calc(100vh - 112px);padding:14px;overflow:auto;background:linear-gradient(#eee4cd,#e5d6b7)}.nav{height:60px;background:#2e291f;display:grid;grid-template-columns:repeat(4,1fr);gap:1px}.nav button{border:0;background:#3b3429;color:#f3e6ca;font-size:13px}.hidden{display:none!important}.hero{min-height:220px;border-radius:14px;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 -120px 120px #0008;background:linear-gradient(135deg,#5a4535,#8a6c4a);margin-bottom:12px}.hero.modern{background:linear-gradient(135deg,#35485d,#8b9daf)}.hero h1,.hero h2{margin:0 0 6px}.hero p{margin:0;opacity:.9}.card{background:#fffaf0;border:1px solid #d3c19e;border-radius:12px;padding:13px;margin:10px 0;box-shadow:0 2px 5px #806a4822}.card h3{margin:0 0 8px;font-size:16px}.muted{color:#80715e;font-size:12px}.dialogue{background:#fffaf0;border-radius:14px;border:1px solid #cdb992;padding:14px;margin-top:12px}.speaker{font-weight:700;color:#8a572d;margin-bottom:7px}.dialogue-text{font-size:16px;line-height:1.65;white-space:pre-wrap}.choices{display:grid;gap:8px;margin-top:12px}.btn{width:100%;padding:12px;border-radius:10px;border:1px solid #9d784e;background:#f8edd8;color:#3e3022;font-size:14px;text-align:left}.btn.primary{background:#7d5430;color:white;border-color:#7d5430}.btn:disabled{opacity:.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.location{min-height:86px;text-align:left}.npc{display:flex;justify-content:space-between;align-items:center}.tag{font-size:11px;background:#e8dcc4;border-radius:999px;padding:4px 7px}.hud{background:#253443;color:white;border-radius:11px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.time{font-size:20px;font-variant-numeric:tabular-nums}.shelf{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#fff;border:1px solid #d8c9ad;border-radius:11px;padding:10px;min-height:115px;display:flex;flex-direction:column}.item b{font-size:14px}.item .desc{font-size:11px;color:#756c60;flex:1;margin:5px 0}.item button{padding:7px;border:0;border-radius:8px;background:#71502e;color:#fff}.bag-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{min-height:80px;border:1px dashed #9c896b;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;background:#f9f0df;font-size:12px}.rumor{border-left:4px solid #a2753f;padding-left:10px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#211d17e8;color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;z-index:10;max-width:380px;text-align:center}.ending{padding:30px 10px;text-align:center}.ending h1{font-size:26px}.upgrade{border:2px solid #957246}.small-actions{display:flex;gap:8px}.small-actions .btn{text-align:center;padding:9px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#8b653e;color:#fff;font-size:11px;margin-left:6px}:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%;overscroll-behavior:none;background:#11100e}body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}button{font-family:inherit;touch-action:manipulation;min-height:48px;cursor:pointer}.app{width:100%;max-width:480px;height:100vh;height:100dvh;min-height:100vh;margin:0 auto;overflow:hidden;box-shadow:none}.topbar{height:calc(52px + var(--safe-top));padding:var(--safe-top) 16px 0;font-size:14px;flex:none}.screen{min-height:0;flex:1;padding:14px 14px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}.nav{height:calc(64px + var(--safe-bottom));padding-bottom:var(--safe-bottom);flex:none;position:relative;z-index:5}.nav button{font-size:13px;min-height:58px}.hero{min-height:200px;border-radius:18px;padding:20px;margin-bottom:14px}.card,.dialogue{border-radius:16px;padding:15px;margin:11px 0}.btn{padding:14px 13px;border-radius:13px;font-size:15px;line-height:1.25}.grid,.shelf{gap:10px}.item{min-height:138px;border-radius:14px;padding:12px}.item button{min-height:44px;font-size:14px}.small-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.small-actions .btn{font-size:13px;padding:9px 4px}.toast{bottom:calc(78px + var(--safe-bottom));max-width:88vw;font-size:13px;padding:11px 15px}.time{font-size:22px}@media (max-width:370px){.grid,.shelf{grid-template-columns:1fr}.item{min-height:112px}.topbar{font-size:12px}.btn{font-size:14px}}@media (min-width:700px){.app{max-width:430px;border-left:1px solid #2e291f;border-right:1px solid #2e291f}}</style>

<body>
<div id="app" class="app"><header class="topbar"><div><b id="dayLabel">Day 1</b><span id="periodLabel"> · 黄昏</span></div><div id="currencyLabel">古 0文 · 现 ¥0</div></header><main id="screen" class="screen"></main><nav id="nav" class="nav hidden"><button data-nav="map">🗺<br>地图</button><button data-nav="rumors">📖<br>见闻</button><button data-nav="bag">🎒<br>行囊</button><button data-nav="portal">◉<br>洞口</button></nav></div>
<script>'use strict';
const ITEMS=[{id:'mantou',name:'馒头×2',price:3,desc:'普通面食，可以充饥。'},{id:'sugar',name:'白糖',price:6,desc:'颗粒洁白的精制糖。'},{id:'noodles',name:'方便面',price:5,desc:'开水冲泡即可食用的面。'},{id:'candy',name:'水果糖',price:5,desc:'甜味糖果，小包装。'},{id:'soap',name:'肥皂',price:5,desc:'清洁手和衣物的日用品。'},{id:'bandage',name:'创可贴×5',price:5,desc:'小型伤口的简单保护用品。'},{id:'alcohol_pad',name:'酒精棉片',price:6,desc:'一次性清洁棉片。'},{id:'lighter',name:'打火机',price:2,desc:'可产生小火苗的点火工具。'},{id:'ballpoint_pen',name:'圆珠笔',price:3,desc:'不用蘸墨的书写工具。'},{id:'pencil',name:'铅笔',price:2,desc:'可在纸张、木材表面书写。'},{id:'mirror',name:'小镜子',price:8,desc:'巴掌大小的玻璃镜。'},{id:'plastic_bag',name:'塑料袋×10',price:3,desc:'轻薄、防水的透明袋。'}];
const LOCATIONS=[['land_temple','土地庙','破败的土地庙，也是你现在睡觉的地方。'],['river','河边','镇民洗衣、取水的地方。'],['poor_lane','贫民巷','青石镇最拥挤破旧的一片。'],['market','集市','白天总有人来来往往。'],['carpenter','木匠坊','王木匠和女儿阿禾在这里干活。'],['pharmacy','药铺','苏婉在济世堂帮工。'],['restaurant','酒楼','你以前只能在门外闻香味。'],['general_store','杂货铺','周掌柜的铺子，什么都卖一点。'],['bookshop','书铺','陈先生经营的小书铺。'],['back_hill','后山','神秘山洞就在这里。']];
const NPCS={land_temple:[['xiaobao','小宝','和你一样的小乞儿']],river:[['liu_aunt','刘婶','镇上消息最灵通的人']],carpenter:[['wang_carpenter','王木匠','嘴硬的木匠'],['ahe','阿禾','王木匠的女儿']],pharmacy:[['suwan','苏婉','济世堂学徒']],restaurant:[['chef_li','李大厨','酒楼厨子']],general_store:[['zhou','周掌柜','精明的杂货铺老板']],bookshop:[['chen_scholar','陈先生','书铺掌柜']]};
const state={day:1,period:'evening',modernMoney:0,ancientMoney:0,modernUsed:false,inModern:false,modernMax:300,modernLeft:300,bagCap:2,bag:[],flags:{},rumors:[],meaningful:0,stone:0,route:null};
let screen=document.querySelector('#screen'),nav=document.querySelector('#nav');
function save(){localStorage.setItem('liangjie_mobile_v05',JSON.stringify(state))}function periodName(){return {morning:'上午',afternoon:'午后',evening:'黄昏',night:'夜晚'}[state.period]}function updateTop(){document.querySelector('#dayLabel').textContent=`Day ${state.day}`;document.querySelector('#periodLabel').textContent=` · ${periodName()}`;document.querySelector('#currencyLabel').textContent=`古 ${state.ancientMoney}文 · 现 ¥${state.modernMoney}`}function showNav(v=true){nav.classList.toggle('hidden',!v)}function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}function render(html){screen.innerHTML=html;updateTop();save()}function itemName(id){return ITEMS.find(x=>x.id===id)?.name||id}function has(id){return state.bag.includes(id)}function addRumor(id,text){if(!state.rumors.some(x=>x.id===id))state.rumors.push({id,text,resolved:false})}function meaningful(){state.meaningful++;if(state.meaningful>=3&&!state.flags.first_stone){state.flags.first_stone=true;state.stone++;setTimeout(showUpgrade,400)}}function consume(id){let i=state.bag.indexOf(id);if(i>=0)state.bag.splice(i,1)}
const day1=[['旁白','青石镇，黄昏。\n你已经一整天没有吃东西了。'],['旁白','包子铺后门掉出半块已经发硬的馒头。'],['你','……还能吃。'],['陈二','哟，小叫花，今天运气不错啊？'],['陈二','拿来。'],['旁白','你转身就跑。身后的脚步越来越近。'],['旁白','大雨里，你逃进镇外破败的土地庙，又被逼上后山。'],['旁白','山坡后面，有一个你以前从未见过的洞。'],['你','这里……有光？'],['旁白','你钻过白光。车声、路灯、高楼，一切都变了。'],['你','这车……为什么没有马？'],['旁白','一扇亮堂堂的门在你靠近时自己打开。你吓得退后一步。'],['林晓','小朋友？你这是……拍戏呢？'],['你','拍戏？'],['林晓','你家大人呢？'],['旁白','她看了你一会儿，又看见你一直盯着柜台旁的饭团。'],['林晓','这个今天本来也要报损。你吃不吃？'],['你','……给我的？'],['旁白','你不会拆包装。她替你撕开。你第一口吃得很慢，第二口就再也停不下来。'],['林晓','慢点，没人跟你抢。'],['旁白','你忽然安静了一下。'],['旁白','耳边响起低沉的嗡鸣，白光似乎正在远去。你本能地跑回小巷和山洞。'],['旁白','回到古代时，外面的雨甚至还没有变大。这里的时间，几乎没有流动。'],['你','明天……那里还会出现吗？']];
function title(){showNav(false);render(`<div class="hero"><h1>两界行商</h1><p>iPhone Mobile Vertical Slice · v0.5</p></div><div class="card"><h3>试玩内容</h3><p>古代小乞丐发现每天一次通往现代的洞口。前三天只能到便利店；你带什么回古代，会决定遇到什么剧情。</p><button class="btn primary" id="start">开始新游戏</button></div>`);document.querySelector('#start').onclick=()=>{Object.assign(state,{day:1,period:'evening',modernMoney:0,ancientMoney:0,modernUsed:false,inModern:false,modernMax:300,modernLeft:300,bagCap:2,bag:[],flags:{},rumors:[],meaningful:0,stone:0,route:null});playDay1(0)}}
function playDay1(i){let [sp,tx]=day1[i];render(`<div class="hero ${i>=9&&i<=20?'modern':''}"><h2>${i<6?'青石镇':i<9?'后山':i<=20?'另一个世界':'后山'}</h2><p>Day 1 · 黄昏</p></div><div class="dialogue"><div class="speaker">${sp}</div><div class="dialogue-text">${tx}</div><div class="choices"><button class="btn primary" id="next">${i===day1.length-1?'睡到第二天':'继续'}</button></div></div>`);document.querySelector('#next').onclick=()=>{if(i<day1.length-1)playDay1(i+1);else{state.day=2;state.period='morning';state.modernUsed=false;state.flags.first_crossing=true;addRumor('portal_rule','神秘洞每天似乎只能开启一次；进入另一边时，古代时间不会流动。');showNav(true);ancientMap()}}}
function ancientMap(){state.inModern=false;showNav(true);let cards=LOCATIONS.map(([id,n,d])=>`<button class="btn location" onclick="locationScreen('${id}')"><b>${n}</b><br><span class="muted">${d}</span></button>`).join('');render(`<div class="hero"><h2>青石镇</h2><p>你可以先四处看看，也可以直接去后山进入现代。</p></div><div class="grid">${cards}</div><div class="card"><button class="btn" onclick="sleepDay()">🌙 回土地庙睡觉，结束今天</button></div>`)}
window.locationScreen=function(id){if(id==='back_hill'){portalScreen();return}let l=LOCATIONS.find(x=>x[0]===id);let npcs=NPCS[id]||[];let html=npcs.length?npcs.map(n=>`<button class="btn npc" onclick="talk('${id}','${n[0]}')"><span><b>${n[1]}</b><br><span class="muted">${n[2]}</span></span><span>›</span></button>`).join(''):`<div class="card muted">这里暂时没有特别的事情，但正式版会出现时段事件和路人。</div>`;render(`<div class="hero"><h2>${l[1]}</h2><p>${l[2]}</p></div><div class="card"><h3>此刻在这里</h3>${html}</div><button class="btn" onclick="ancientMap()">← 返回地图</button>`)};
window.talk=function(loc,npc){if(npc==='wang_carpenter'&&has('pencil')&&!state.flags.wang_pencil){dialog('王木匠','你这小叫花手里拿的是什么？在木头上写得这么细？',[['递给他铅笔',()=>{consume('pencil');state.flags.wang_pencil=true;state.ancientMoney+=8;addRumor('wang_pencil','王木匠很喜欢能在木料上画细线的铅笔，还问你有没有。');meaningful();toast('获得 8 文 · 发现一种有效用途');locationScreen(loc)}],['先不给',()=>locationScreen(loc)]]);return}if(npc==='liu_aunt'&&has('soap')&&!state.flags.liu_soap){dialog('刘婶','唉，这件衣裳沾了油，搓半天都不干净。',[['试试肥皂',()=>{consume('soap');state.flags.liu_soap=true;addRumor('liu_soap','刘婶觉得肥皂去油很方便，也愿意告诉你镇里的新鲜事。');meaningful();toast('刘婶关系提升 · 解锁镇中消息伏笔');locationScreen(loc)}],['不管',()=>locationScreen(loc)]]);return}if(npc==='xiaobao'&&has('mantou')&&!state.flags.xiaobao_food){dialog('小宝','……你有吃的？',[['给他一个馒头',()=>{consume('mantou');state.flags.xiaobao_food=true;addRumor('xiaobao_food','小宝把第二个馒头留给了明早。');meaningful();toast('小宝记住了这顿饭');locationScreen(loc)}],['自己留着',()=>locationScreen(loc)]]);return}if(npc==='ahe'&&has('bandage')&&!state.flags.ahe_bandage){dialog('阿禾','嘶……这木头边怎么这么利。',[['用创可贴帮她',()=>{consume('bandage');state.flags.ahe_bandage=true;addRumor('ahe_bandage','阿禾用上了奇怪的小贴布。药铺的人也许会对它感兴趣。');meaningful();toast('阿禾关系提升 · 药铺路线出现线索');locationScreen(loc)}],['找块布给她',()=>{state.flags.ahe_cloth=true;addRumor('ahe_cloth','阿禾手被木头划伤，你用普通布条帮她包扎。');locationScreen(loc)}]]);return}if(npc==='chen_scholar'&&has('ballpoint_pen')&&!state.flags.chen_pen){dialog('陈先生','等等……你这支笔为何不用蘸墨？',[['让他试写',()=>{consume('ballpoint_pen');state.flags.chen_pen=true;addRumor('chen_pen','陈先生对不用蘸墨的圆珠笔很好奇，但第一句话是：墨用尽以后怎么办？');meaningful();toast('陈先生关系提升');locationScreen(loc)}]]);return}if(npc==='chef_li'&&has('sugar')&&!state.flags.chef_sugar){dialog('李大厨','这是糖？怎么白得几乎没有杂色。',[['让他尝尝',()=>{consume('sugar');state.flags.chef_sugar=true;state.ancientMoney+=10;addRumor('chef_sugar','李大厨正在研究用精制白糖做新糕点。');meaningful();toast('获得 10 文 · 酒楼路线开启');locationScreen(loc)}]]);return}if(npc==='chef_li'&&has('noodles')&&!state.flags.chef_noodles){dialog('李大厨','这面怎么弯弯曲曲的？',[['泡给他尝',()=>{consume('noodles');state.flags.chef_noodles=true;addRumor('chef_noodles','李大厨觉得方便面的面一般，却对调料包特别感兴趣。');meaningful();toast('发现：调料可能比面更有价值');locationScreen(loc)}]]);return}if(npc==='zhou'&&has('lighter')&&!state.flags.zhou_lighter){dialog('周掌柜','先别收。刚才你点火那个东西，我看看。',[['给他试试',()=>{consume('lighter');state.flags.zhou_lighter=true;state.ancientMoney+=30;addRumor('zhou_lighter','周掌柜用 30 文收了第一只打火机，但他更关心你能不能稳定供货。');meaningful();toast('获得 30 文 · 商业路线开启');locationScreen(loc)}]]);return}const normal={wang_carpenter:'没活就别挡着光。',ahe:'你今天又去哪儿啦？',suwan:'药铺今天有点忙。',chef_li:'没钱吃饭就别在门口闻了……算了，闻吧。',zhou:'做生意讲的是货和信用。',chen_scholar:'书可以翻，手得干净。',liu_aunt:'镇里什么事都瞒不过河边。',xiaobao:'今天运气怎么样？'}[npc]||'没什么特别的。';dialog((NPCS[loc]||[]).find(x=>x[0]===npc)?.[1]||npc,normal,[["知道了",()=>locationScreen(loc)]])};
function dialog(speaker,text,choices){let buttons=choices.map((c,i)=>`<button class="btn ${i===0?'primary':''}" id="c${i}">${c[0]}</button>`).join('');render(`<div class="hero"><h2>${speaker}</h2><p>青石镇</p></div><div class="dialogue"><div class="speaker">${speaker}</div><div class="dialogue-text">${text}</div><div class="choices">${buttons}</div></div>`);choices.forEach((c,i)=>document.querySelector('#c'+i).onclick=c[1])}
function portalScreen(){let status=state.modernUsed?'今天的白光已经熄灭。':'白光正在洞穴深处微微闪动。';render(`<div class="hero"><h2>后山 · 神秘洞</h2><p>${status}</p></div><div class="card"><h3>两界之门</h3><p>现代停留：${Math.floor(state.modernMax/60)} 分钟<br>穿越行囊：${state.bag.length}/${state.bagCap} 格<br>今日机会：${state.modernUsed?'已使用':'1 次'}</p><button class="btn primary" id="enter" ${state.modernUsed?'disabled':''}>进入现代</button></div><button class="btn" onclick="ancientMap()">← 返回地图</button>`);document.querySelector('#enter').onclick=enterModern}
function enterModern(){if(state.modernUsed)return;state.inModern=true;state.modernUsed=true;state.modernLeft=state.modernMax-30;modernStore()}function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function modernStore(){showNav(false);let shelf=ITEMS.map(i=>`<div class="item"><b>${i.name}</b><span class="badge">¥${i.price}</span><div class="desc">${i.desc}</div><button onclick="buy('${i.id}')" ${state.bag.length>=state.bagCap||state.modernMoney<i.price?'disabled':''}>放进行囊</button></div>`).join('');render(`<div class="hud"><span>现代停留时间</span><b class="time">${fmt(state.modernLeft)}</b></div><div class="hero modern"><h2>24h 便利店</h2><p>前三天，你在现代能到达的只有这里。</p></div><div class="card"><h3>林晓</h3><p>${state.day===2?'“你今天居然又来了？要不要帮我搬一下后面的箱子？”':state.day>=3?'“三天了。你还真是天天来。”':'“慢点，没人跟你抢。”'}</p></div>${state.day>=2?`<div class="card"><h3>临时打工</h3><div class="small-actions"><button class="btn" onclick="job(180,20)">搬货<br><small>3:00 / ¥20</small></button><button class="btn" onclick="job(60,8)">折纸箱<br><small>1:00 / ¥8</small></button><button class="btn" onclick="job(120,15)">整理货架<br><small>2:00 / ¥15</small></button></div></div>`:''}<div class="card"><h3>货架 <span class="muted">行囊 ${state.bag.length}/${state.bagCap}</span></h3><div class="shelf">${shelf}</div></div><button class="btn primary" onclick="returnAncient()">返回古代（路程 0:30）</button>`)}
window.buy=function(id){let i=ITEMS.find(x=>x.id===id);if(state.modernMoney<i.price){toast('钱不够');return}if(state.bag.length>=state.bagCap){toast('穿越行囊已经满了');return}state.modernMoney-=i.price;state.bag.push(id);toast(`${i.name} 已放入行囊`);modernStore()};window.job=function(sec,pay){if(state.modernLeft<sec+30){toast('剩余时间不够，还需要留出返回洞口的时间');return}state.modernLeft-=sec;state.modernMoney+=pay;toast(`打工完成，获得 ¥${pay}`);modernStore()};window.returnAncient=function(){if(state.modernLeft>=30)state.modernLeft-=30;state.inModern=false;showNav(true);ancientMap()};window.sleepDay=function(){if(state.day>=3){day3Ending();return}state.day++;state.period='morning';state.modernUsed=false;state.modernLeft=state.modernMax;if(state.day===3)addRumor('day3_goal','昨天认识的人，也许会继续询问你带回来的那些东西。今天去现代时，你可以更有目的地选择。');ancientMap()};
function showUpgrade(){if(state.flags.upgrade_done||state.stone<1)return;render(`<div class="hero"><h2>界石亮了</h2><p>你在两个世界之间建立的联系，让通道发生了变化。</p></div><div class="card upgrade"><h3>首次强化 · 二选一</h3><button class="btn primary" id="timeup">通道稳定<br><span class="muted">现代停留 5:00 → 7:00</span></button><button class="btn" id="bagup">行囊扩展<br><span class="muted">穿越容量 2格 → 3格</span></button></div>`);document.querySelector('#timeup').onclick=()=>{state.modernMax=420;state.stone--;state.flags.upgrade_done=true;toast('现代停留时间提升');ancientMap()};document.querySelector('#bagup').onclick=()=>{state.bagCap=3;state.stone--;state.flags.upgrade_done=true;toast('穿越行囊扩展');ancientMap()}}
function rumorsScreen(){let list=state.rumors.length?state.rumors.map(x=>`<div class="card rumor">${x.text}</div>`).join(''):'<div class="card muted">你还没有记录任何见闻。去不同地方看看吧。</div>';render(`<div class="hero"><h2>青石镇见闻</h2><p>这里只有你观察到的问题，没有标准答案。</p></div>${list}<button class="btn" onclick="ancientMap()">← 返回</button>`)}function bagScreen(){let slots=[];for(let i=0;i<state.bagCap;i++)slots.push(`<div class="slot">${state.bag[i]?itemName(state.bag[i]):'空'}</div>`);render(`<div class="hero"><h2>穿越行囊</h2><p>只有放进这里的东西才能跨越两个世界。</p></div><div class="card"><div class="bag-slots">${slots.join('')}</div></div><button class="btn" onclick="ancientMap()">← 返回</button>`)}
function day3Ending(){render(`<div class="ending"><h1>Vertical Slice 完成</h1><p>前三天结束。</p><div class="card"><b>你已经产生 ${state.meaningful} 次有意义的两界互动</b><p>这版原型要验证的问题只有一个：</p><p><b>如果明天还能去现代一次，你现在最想带什么回来？</b></p></div><button class="btn primary" onclick="routeChoice()">看看 Day 4 的方向</button><button class="btn" onclick="title()">返回标题</button></div>`)}window.routeChoice=function(){render(`<div class="hero modern"><h2>现代世界，比便利店大得多</h2><p>林晓：“你最近到底在找什么？”</p></div><div class="choices"><button class="btn" onclick="route('五金店')">🔨 做东西用的工具</button><button class="btn" onclick="route('药店')">💊 处理伤口的东西</button><button class="btn" onclick="route('小超市')">🛒 更多吃的</button><button class="btn" onclick="route('文具店')">✏️ 纸和笔</button></div>`)};window.route=function(x){render(`<div class="ending"><h1>Day 4</h1><p>优先解锁：<b>${x}</b></p><p>其余地点以后依然可以发现，并不会永久锁死。</p><div class="card"><b>iPhone 试玩版 v0.5 到这里结束。</b><p class="muted">下一版将接 Day 4～Day 7：现代分支地图、稳定需求、寄售与第一次摆摊。</p></div><button class="btn primary" onclick="title()">完成</button></div>`)};
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let k=b.dataset.nav;if(k==='map')ancientMap();if(k==='rumors')rumorsScreen();if(k==='bag')bagScreen();if(k==='portal')portalScreen()});title();
</script>
</body>
</html>
